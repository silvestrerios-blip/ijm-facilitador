<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IJM Facilitador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --v:  #54C999;
  --vd: #3aaa7f;
  --g:  #666666;
  --gd: #4a4a4a;
  --gl: #888;
  --bg: #5a5a5a;
  --mesa: #606060;
  --n:  #1a1a1a;
  --b:  #ffffff;
  --card-w: 180px;
  --card-h: 120px;  /* horizontal */
  --card-pal-w: 220px;
  --card-pal-h: 44px;
  --card-ic-w: 120px;
  --card-ic-h: 120px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Outfit',sans-serif}

body{
  background:var(--bg);
  color:var(--b);
  display:flex;
  flex-direction:column;
}

/* ══ TOOLBAR ══ */
#toolbar{
  position:fixed;top:0;left:0;right:0;
  height:52px;
  background:rgba(42,42,42,.96);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;
  padding:0 14px;gap:10px;
  z-index:100;
  border-bottom:1px solid rgba(84,201,153,.2);
}

/* Logo botón */
#btn-aleatoria{
  display:flex;align-items:center;gap:8px;
  background:none;border:none;cursor:pointer;
  padding:6px 10px;border-radius:8px;
  transition:background .15s;
  flex-shrink:0;
}
#btn-aleatoria:hover{background:rgba(84,201,153,.12)}
#btn-aleatoria:active{background:rgba(84,201,153,.22);transform:scale(.97)}

.ijm-spiral{
  width:32px;height:32px;flex-shrink:0;
}

#btn-aleatoria span{
  font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:1.5px;
  color:var(--v);
}

/* Separador */
.sep{width:1px;height:28px;background:rgba(255,255,255,.1);flex-shrink:0}

/* Chips de mazo */
.chips{display:flex;gap:5px;flex:1;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:5px 12px;border-radius:16px;
  border:1.5px solid rgba(255,255,255,.15);
  background:transparent;
  font-size:10px;font-weight:700;cursor:pointer;
  white-space:nowrap;transition:all .15s;
  color:rgba(255,255,255,.5);
  font-family:'Outfit',sans-serif;
  letter-spacing:.5px;
}
.chip:hover{border-color:var(--v);color:var(--v)}
.chip.on{border-color:var(--v);background:var(--v);color:#fff}

/* Botones derecha */
.tb-right{display:flex;gap:8px;align-items:center;flex-shrink:0}

#btn-limpiar{
  padding:6px 14px;border-radius:8px;
  border:1.5px solid rgba(255,80,80,.3);
  background:transparent;color:rgba(255,100,100,.7);
  font-size:10px;font-weight:700;cursor:pointer;
  text-transform:uppercase;letter-spacing:.8px;
  font-family:'Outfit',sans-serif;
  transition:all .15s;
}
#btn-limpiar:hover{border-color:#ff5050;color:#ff5050;background:rgba(255,80,80,.08)}

#contador{
  font-size:10px;color:rgba(255,255,255,.3);
  font-weight:600;letter-spacing:.5px;
  min-width:40px;text-align:right;
}

/* ══ MESA ══ */
#mesa-wrap{
  position:fixed;
  top:52px;bottom:0;left:0;right:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}

#mesa{
  position:relative;
  width:100%;
  height:200vh;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(84,201,153,.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(84,201,153,.03) 0%, transparent 50%),
    var(--mesa);
}

/* Textura sutil de mesa */
#mesa::before{
  content:'';
  position:absolute;inset:0;
  background-image: repeating-linear-gradient(
    0deg, transparent, transparent 40px,
    rgba(0,0,0,.03) 40px, rgba(0,0,0,.03) 41px
  ),
  repeating-linear-gradient(
    90deg, transparent, transparent 40px,
    rgba(0,0,0,.03) 40px, rgba(0,0,0,.03) 41px
  );
  pointer-events:none;
}

/* ══ CARTAS ══ */
.carta{
  position:absolute;
  cursor:grab;
  user-select:none;
  border-radius:8px;
  box-shadow: 0 4px 20px rgba(0,0,0,.4), 0 1px 4px rgba(0,0,0,.3);
  transition:box-shadow .15s, transform .1s;
  overflow:hidden;
  touch-action:none;
}
.carta:hover{
  box-shadow: 0 8px 32px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
  z-index:50!important;
}
.carta.dragging{
  cursor:grabbing;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
  transform:scale(1.04) rotate(1deg);
  z-index:200!important;
  transition:box-shadow .1s;
}
.carta.selected{
  outline:2px solid var(--v);
  outline-offset:2px;
}

/* Carta general/S/N — horizontal */
.carta-foto{
  width:var(--card-w);
  height:var(--card-h);
}
.carta-foto img{
  width:100%;height:calc(100% - 0px);
  object-fit:cover;display:block;
}
/* Banda inferior S/N */
.banda{
  height:6px;width:100%;
  position:absolute;bottom:0;left:0;
}
.banda-s{background:#e03030}
.banda-n{background:#2060d0}

/* Carta PAL — palito apaisado */
.carta-pal{
  width:var(--card-pal-w);
  height:var(--card-pal-h);
}
.carta-pal img{
  width:100%;height:100%;
  object-fit:cover;display:block;
}

/* Carta IC — cuadrado */
.carta-ic{
  width:var(--card-ic-w);
  height:var(--card-ic-h);
  background:#fff;
  display:flex;flex-direction:column;
}
.carta-ic img{
  width:100%;flex:1;
  object-fit:contain;display:block;
  padding:8px;
}
.carta-ic .ic-input{
  width:100%;border:none;outline:none;
  background:rgba(84,201,153,.08);
  border-top:1px solid rgba(84,201,153,.2);
  font-size:9px;color:#333;
  padding:4px 6px;
  font-family:'Outfit',sans-serif;
  text-align:center;
  cursor:text;
}
.carta-ic .ic-input::placeholder{color:#bbb}

/* Botón eliminar carta */
.btn-del{
  position:absolute;top:-6px;right:-6px;
  width:18px;height:18px;border-radius:50%;
  background:#ff4455;color:#fff;
  border:2px solid var(--mesa);
  font-size:9px;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  font-weight:900;line-height:1;
  z-index:10;transition:transform .1s;
}
.carta:hover .btn-del,
.carta.selected .btn-del{display:flex}
.btn-del:hover{transform:scale(1.2)}

/* Animación entrada */
@keyframes cartaEntra{
  from{opacity:0;transform:scale(.85) rotate(-3deg)}
  to{opacity:1;transform:scale(1) rotate(0deg)}
}
.carta{animation:cartaEntra .25s cubic-bezier(.34,1.56,.64,1)}

/* ══ VER FULLSCREEN ══ */
#ver{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.92);
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
}
#ver.on{display:flex}
#ver img{
  max-width:90vw;max-height:88vh;
  object-fit:contain;
  border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
#ver-close{
  position:absolute;top:20px;right:20px;
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.12);
  border:1.5px solid rgba(255,255,255,.2);
  color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;font-family:'Outfit',sans-serif;
}
#ver-close:hover{background:rgba(255,255,255,.22)}
#ver-lbl{
  position:absolute;bottom:24px;
  color:rgba(255,255,255,.4);
  font-size:12px;font-weight:600;letter-spacing:1px;
}

/* ══ MODAL CONFIRMAR ══ */
#modal{
  position:fixed;inset:0;z-index:600;
  background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
}
#modal.on{display:flex}
#modal-box{
  background:#2a2a2a;
  border:1px solid rgba(255,80,80,.3);
  border-radius:14px;padding:28px 32px;
  text-align:center;max-width:340px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
#modal-box h3{
  font-size:16px;font-weight:700;
  color:#fff;margin-bottom:8px;
}
#modal-box p{
  font-size:13px;color:rgba(255,255,255,.5);
  margin-bottom:22px;line-height:1.5;
}
.modal-btns{display:flex;gap:10px}
.modal-btns button{
  flex:1;padding:11px;border-radius:8px;
  border:none;cursor:pointer;
  font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;
  font-family:'Outfit',sans-serif;
  transition:all .15s;
}
#modal-cancel{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
#modal-cancel:hover{background:rgba(255,255,255,.14)}
#modal-confirm{background:#ff4455;color:#fff}
#modal-confirm:hover{background:#ff2233}

/* ══ TOAST ══ */
#toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%);
  background:rgba(26,26,26,.9);color:#fff;
  padding:9px 20px;border-radius:20px;
  font-size:12px;font-weight:600;z-index:700;
  display:none;white-space:nowrap;
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);
}

/* ══ EMPTY STATE ══ */
#empty{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-60%);
  text-align:center;
  pointer-events:none;
  opacity:.25;
  transition:opacity .3s;
}
#empty.hidden{opacity:0}
#empty svg{width:64px;height:64px;margin-bottom:16px;opacity:.6}
#empty p{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--v)}
#empty small{font-size:11px;color:rgba(255,255,255,.4);display:block;margin-top:4px}
</style>
</head>

<div id="toolbar">

<script>
// ═══════════════════════════════════════════
// ⚙️  CONFIGURACIÓN
// ═══════════════════════════════════════════
const SB_URL = 'https://lynqikyddjogbndaonia.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5bnFpa3lkZGpvZ2JuZGFvbmlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDI5MjEsImV4cCI6MjA5MDcxODkyMX0.pAEaYp3VO2pwccFZpy60K-Plww2tj6swCGT42xqie7U';
const BUCKET = 'imagenes-IJM';

// Número de cartas por mazo — cambia aquí cuando añadas imágenes
const MAZOS = {
  general: { n: 107, bucket: 'imagenes-IJM',   ext: '.jpg', tipo: 'foto',  banda: null    },
  s:       { n:  54, bucket: 'imagenes-S',      ext: '.jpg', tipo: 'foto',  banda: 'banda-s' },
  n:       { n:  54, bucket: 'imagenes-N',      ext: '.jpg', tipo: 'foto',  banda: 'banda-n' },
  pal:     { n:  33, bucket: 'imagenes-PAL',    ext: '.jpg', tipo: 'pal',   banda: null    },
  ic:      { n:  37, bucket: 'imagenes-IC',     ext: '.png', tipo: 'ic',    banda: null    },
};

// ═══════════════════════════════════════════
// 🧠  ESTADO
// ═══════════════════════════════════════════
let mazoActual = 'general';
let cartas = [];
let zMax = 10;
let cardCount = 0;
let cartaSeleccionada = null;

// ═══════════════════════════════════════════
// 🃏  SACAR CARTA
// ═══════════════════════════════════════════
function setMazo(key, el) {
  mazoActual = key;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
}

function imgUrl(mazo, n) {
  const m = MAZOS[mazo];
  return `${SB_URL}/storage/v1/object/public/${m.bucket}/${n}${m.ext}`;
}

function sacarCarta() {
  const m = MAZOS[mazoActual];
  const n = Math.floor(Math.random() * m.n) + 1;
  const mesa = document.getElementById('mesa');
  const wrap = document.getElementById('mesa-wrap');

  // Posición aleatoria en el área visible
  const scrollTop = wrap.scrollTop;
  const ww = mesa.offsetWidth;
  const vh = wrap.offsetHeight;

  let cw, ch;
  if (m.tipo === 'foto')  { cw = 180; ch = 120; }
  if (m.tipo === 'pal')   { cw = 220; ch = 44;  }
  if (m.tipo === 'ic')    { cw = 120; ch = 120; }

  const margin = 20;
  const x = margin + Math.random() * (ww - cw - margin * 2);
  const y = scrollTop + margin + Math.random() * (vh - ch - margin * 2);

  crearCarta(mazoActual, n, x, y);
  document.getElementById('empty').classList.add('hidden');
}

function crearCarta(mazo, n, x, y) {
  const m = MAZOS[mazo];
  const mesa = document.getElementById('mesa');
  const id = 'c' + (++cardCount);

  const div = document.createElement('div');
  div.className = `carta carta-${m.tipo === 'foto' ? 'foto' : m.tipo}`;
  div.id = id;
  div.style.left = x + 'px';
  div.style.top  = y + 'px';
  div.style.zIndex = ++zMax;

  if (m.tipo === 'foto') {
    const img = document.createElement('img');
    img.src = imgUrl(mazo, n);
    img.alt = `Carta ${n}`;
    img.draggable = false;
    img.onclick = () => verAmpliada(imgUrl(mazo, n), `${mazo.toUpperCase()} · Carta ${n}`);
    div.appendChild(img);
    if (m.banda) {
      const banda = document.createElement('div');
      banda.className = `banda ${m.banda}`;
      div.appendChild(banda);
    }
  } else if (m.tipo === 'pal') {
    const img = document.createElement('img');
    img.src = imgUrl(mazo, n);
    img.alt = `PAL ${n}`;
    img.draggable = false;
    img.onclick = () => verAmpliada(imgUrl(mazo, n), `PAL · Carta ${n}`);
    div.appendChild(img);
  } else if (m.tipo === 'ic') {
    const img = document.createElement('img');
    img.src = imgUrl(mazo, n);
    img.alt = `IC ${n}`;
    img.draggable = false;
    img.onclick = () => verAmpliada(imgUrl(mazo, n), `IC · Icono ${n}`);
    div.appendChild(img);
    const inp = document.createElement('input');
    inp.className = 'ic-input';
    inp.placeholder = '¿Qué pregunta te sugiere?';
    inp.type = 'text';
    inp.onclick = e => e.stopPropagation();
    inp.onmousedown = e => e.stopPropagation();
    div.appendChild(inp);
  }

  // Botón eliminar
  const del = document.createElement('button');
  del.className = 'btn-del';
  del.textContent = '✕';
  del.title = 'Eliminar carta (Supr)';
  del.onclick = e => { e.stopPropagation(); eliminarCarta(div); };
  div.appendChild(del);

  // Drag
  makeDraggable(div);

  // Selección
  div.addEventListener('mousedown', e => {
    seleccionar(div);
    div.style.zIndex = ++zMax;
  });

  mesa.appendChild(div);
  cartas.push(div);
  actualizarContador();
}

// ═══════════════════════════════════════════
// 🖱️  DRAG & DROP
// ═══════════════════════════════════════════
function makeDraggable(el) {
  let startX, startY, startL, startT, moving = false;

  el.addEventListener('mousedown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'IMG' && e.detail > 1) return;
    e.preventDefault();
    const wrap = document.getElementById('mesa-wrap');
    startX = e.clientX;
    startY = e.clientY + wrap.scrollTop;
    startL = parseInt(el.style.left) || 0;
    startT = parseInt(el.style.top)  || 0;
    moving = false;
    el.classList.add('dragging');

    function onMove(e) {
      const dx = e.clientX - startX;
      const dy = (e.clientY + wrap.scrollTop) - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moving = true;
      if (!moving) return;
      const mesa = document.getElementById('mesa');
      const newL = Math.max(0, Math.min(startL + dx, mesa.offsetWidth - el.offsetWidth));
      const newT = Math.max(0, Math.min(startT + dy, mesa.offsetHeight - el.offsetHeight));
      el.style.left = newL + 'px';
      el.style.top  = newT + 'px';
    }

    function onUp(e) {
      el.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Touch
  el.addEventListener('touchstart', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
    const wrap = document.getElementById('mesa-wrap');
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY + wrap.scrollTop;
    startL = parseInt(el.style.left) || 0;
    startT = parseInt(el.style.top)  || 0;
    moving = false;
    el.classList.add('dragging');
    el.style.zIndex = ++zMax;

    function onTMove(e) {
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = (t.clientY + wrap.scrollTop) - startY;
      moving = true;
      const mesa = document.getElementById('mesa');
      const newL = Math.max(0, Math.min(startL + dx, mesa.offsetWidth - el.offsetWidth));
      const newT = Math.max(0, Math.min(startT + dy, mesa.offsetHeight - el.offsetHeight));
      el.style.left = newL + 'px';
      el.style.top  = newT + 'px';
    }

    function onTEnd() {
      el.classList.remove('dragging');
      el.removeEventListener('touchmove', onTMove);
      el.removeEventListener('touchend', onTEnd);
    }

    el.addEventListener('touchmove', onTMove, { passive: false });
    el.addEventListener('touchend', onTEnd);
  }, { passive: true });
}

// ═══════════════════════════════════════════
// 🔍  VER FULLSCREEN
// ═══════════════════════════════════════════
function verAmpliada(url, label) {
  document.getElementById('ver-img').src = url;
  document.getElementById('ver-lbl').textContent = label;
  document.getElementById('ver').classList.add('on');
}
function cerrarVer() {
  document.getElementById('ver').classList.remove('on');
}

// ═══════════════════════════════════════════
// 🗑️  ELIMINAR
// ═══════════════════════════════════════════
function seleccionar(el) {
  if (cartaSeleccionada) cartaSeleccionada.classList.remove('selected');
  cartaSeleccionada = el;
  el.classList.add('selected');
}

function eliminarCarta(el) {
  el.style.transition = 'opacity .2s, transform .2s';
  el.style.opacity = '0';
  el.style.transform = 'scale(.8)';
  setTimeout(() => {
    el.remove();
    cartas = cartas.filter(c => c !== el);
    if (cartaSeleccionada === el) cartaSeleccionada = null;
    actualizarContador();
    if (cartas.length === 0) document.getElementById('empty').classList.remove('hidden');
  }, 200);
}

function pedirLimpiar() {
  if (cartas.length === 0) { toast('La mesa ya está vacía'); return; }
  document.getElementById('modal').classList.add('on');
}
function cerrarModal() {
  document.getElementById('modal').classList.remove('on');
}
function limpiarMesa() {
  cartas.forEach(c => c.remove());
  cartas = [];
  cartaSeleccionada = null;
  cerrarModal();
  actualizarContador();
  document.getElementById('empty').classList.remove('hidden');
  toast('Mesa limpiada');
}

// ═══════════════════════════════════════════
// ⌨️  TECLADO
// ═══════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Delete' || e.key === 'Backspace' && e.target.tagName !== 'INPUT') {
    if (cartaSeleccionada) eliminarCarta(cartaSeleccionada);
  }
  if (e.key === 'Escape') {
    cerrarVer();
    cerrarModal();
  }
});

// Click en mesa — deseleccionar
document.getElementById('mesa').addEventListener('mousedown', e => {
  if (e.target === document.getElementById('mesa') || e.target === document.getElementById('empty')) {
    if (cartaSeleccionada) {
      cartaSeleccionada.classList.remove('selected');
      cartaSeleccionada = null;
    }
  }
});

// ═══════════════════════════════════════════
// 🛠️  UTILS
// ═══════════════════════════════════════════
function actualizarContador() {
  const n = cartas.length;
  document.getElementById('contador').textContent = n === 0 ? '' : n === 1 ? '1 carta' : `${n} cartas`;
}

let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(_tt);
  _tt = setTimeout(() => el.style.display = 'none', 2400);
}
</script>
</body>
</html>
