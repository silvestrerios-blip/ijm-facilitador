<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IJM Facilitador</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a2a2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --v:#54C999;--vd:#3aaa7f;
  --mesa:#606060;--tb:50px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Outfit',sans-serif}
body{background:var(--mesa);color:#fff}

/* ══ TOOLBAR ══ */
#toolbar{
  position:fixed;top:0;left:0;right:0;height:var(--tb);
  background:rgba(28,28,28,.97);backdrop-filter:blur(14px);
  display:flex;align-items:center;padding:0 12px;gap:8px;
  z-index:100;border-bottom:1px solid rgba(84,201,153,.22);
}
#ijm-logo{
  display:flex;align-items:center;gap:7px;
  flex-shrink:0;user-select:none;
}
.ijm-spiral{width:26px;height:26px;flex-shrink:0}
.ijm-text{font-size:9.5px;font-weight:900;letter-spacing:1.4px;white-space:nowrap;line-height:1}
.t1,.t3{color:rgba(255,255,255,.6)}
.t2{color:var(--v)}
.sep{width:1px;height:24px;background:rgba(255,255,255,.1);flex-shrink:0}

/* Chips */
.chips{
  display:flex;gap:5px;flex:1;
  overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:5px 12px;border-radius:14px;
  border:1.5px solid rgba(255,255,255,.12);background:transparent;
  font-size:9.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:all .15s;color:rgba(255,255,255,.4);
  font-family:'Outfit',sans-serif;letter-spacing:.4px;flex-shrink:0;
}
.chip:hover{border-color:var(--v);color:var(--v);background:rgba(84,201,153,.07)}
.chip:active{transform:scale(.93)}
.chip.on{border-color:var(--v);background:var(--v);color:#fff}

/* Botones derecha */
.tb-right{display:flex;gap:6px;align-items:center;flex-shrink:0}
#btn-nota{
  width:30px;height:30px;border-radius:7px;
  border:1.5px solid rgba(84,201,153,.28);background:transparent;
  color:var(--v);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;
}
#btn-nota:hover{background:rgba(84,201,153,.1);border-color:var(--v)}
#btn-nota svg{width:14px;height:14px}
#btn-limpiar{
  padding:5px 11px;border-radius:7px;
  border:1.5px solid rgba(255,80,80,.22);background:transparent;
  color:rgba(255,100,100,.55);
  font-size:9.5px;font-weight:700;cursor:pointer;
  font-family:'Outfit',sans-serif;transition:all .15s;white-space:nowrap;
}
#btn-limpiar:hover{border-color:#ff5050;color:#ff5050}
#contador{font-size:9.5px;color:rgba(255,255,255,.22);font-weight:600;white-space:nowrap;min-width:44px;text-align:right}

/* ══ MESA ══ */
#mesa-wrap{
  position:fixed;top:var(--tb);bottom:0;left:0;right:0;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
}
#mesa{
  position:relative;width:100%;height:200vh;
  background:
    radial-gradient(ellipse at 15% 20%,rgba(84,201,153,.055) 0%,transparent 42%),
    radial-gradient(ellipse at 85% 80%,rgba(84,201,153,.04) 0%,transparent 42%),
    var(--mesa);
}
#mesa::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(0,0,0,.022) 40px,rgba(0,0,0,.022) 41px),
    repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(0,0,0,.022) 40px,rgba(0,0,0,.022) 41px);
}

/* ══ CARTAS ══ */
.carta{
  position:absolute;cursor:grab;user-select:none;
  border-radius:8px;overflow:hidden;touch-action:none;
  box-shadow:0 4px 18px rgba(0,0,0,.45),0 1px 4px rgba(0,0,0,.3);
  transition:box-shadow .15s;
}
.carta:hover{box-shadow:0 8px 28px rgba(0,0,0,.55);z-index:50!important}
.carta.dragging{
  cursor:grabbing;transform:scale(1.04) rotate(.7deg);
  box-shadow:0 16px 48px rgba(0,0,0,.65);z-index:200!important;transition:none;
}
.carta.selected{outline:2.5px solid var(--v);outline-offset:2px}
@keyframes cartaEntra{
  from{opacity:0;transform:scale(.8) rotate(-2.5deg)}
  to{opacity:1;transform:scale(1) rotate(0deg)}
}
.carta{animation:cartaEntra .22s cubic-bezier(.34,1.56,.64,1)}

/* Foto */
.carta-foto{width:180px;height:120px}
.carta-foto img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.banda{height:6px;width:100%;position:absolute;bottom:0;left:0}
.banda-s{background:#d42020}
.banda-n{background:#1a55cc}

/* Franja nombre carta */
.franja-nombre{
  position:absolute;bottom:0;left:0;right:0;
  height:8px;
  background:rgba(84,201,153,.18);
  cursor:pointer;transition:height .2s,background .2s;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.franja-nombre:hover{background:rgba(84,201,153,.28);height:10px}
.franja-nombre.on{
  height:28px;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(4px);
}
.franja-nombre .fn-txt{
  color:#fff;font-size:11px;font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;
  opacity:0;transition:opacity .18s;
  white-space:nowrap;pointer-events:none;
  text-shadow:0 1px 4px rgba(0,0,0,.5);
}
.franja-nombre.on .fn-txt{opacity:1}


/* PAL */
.carta-pal{width:220px;height:44px}
.carta-pal img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}

/* IC cuadrado */
.carta-ic{width:120px;height:138px;background:#fff;display:flex;flex-direction:column}
.carta-ic img{width:100%;flex:1;object-fit:contain;padding:10px;display:block;pointer-events:none}
.ic-input{
  width:100%;border:none;outline:none;
  background:rgba(84,201,153,.07);border-top:1px solid rgba(84,201,153,.22);
  font-size:9px;color:#444;padding:5px 6px;
  font-family:'Outfit',sans-serif;text-align:center;cursor:text;
}
.ic-input::placeholder{color:#ccc}

/* Nota/post-it */
.carta-nota{width:160px;min-height:60px;background:#fff;border:2px solid var(--v);display:flex;flex-direction:column}
.nota-hdr{
  display:flex;align-items:center;gap:4px;padding:6px 8px 4px;
  border-bottom:1px solid rgba(84,201,153,.18);
  cursor:grab;user-select:none;
}
.nota-hdr:active{cursor:grabbing}
.nota-hdr svg{width:10px;height:10px;stroke:var(--v);flex-shrink:0}
.nota-hdr span{font-size:8.5px;color:var(--v);font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.nota-body{
  flex:1;width:100%;border:none;outline:none;resize:none;
  font-size:11.5px;color:#333;font-family:'Outfit',sans-serif;
  line-height:1.5;background:transparent;padding:7px 8px;
  min-height:36px;cursor:text;
}
.nota-body::placeholder{color:#ccc}

/* Botón ✕ */
.btn-del{
  position:absolute;top:-7px;right:-7px;
  width:19px;height:19px;border-radius:50%;
  background:#ff4455;color:#fff;border:2px solid var(--mesa);
  font-size:8px;cursor:pointer;display:none;
  align-items:center;justify-content:center;
  font-weight:900;z-index:10;line-height:1;padding:0;transition:transform .1s;
}
.carta:hover .btn-del,.carta.selected .btn-del{display:flex}
.btn-del:hover{transform:scale(1.15)}

/* ══ MINI MENÚ ══ */
#mini-menu{
  position:fixed;z-index:400;
  background:rgba(26,26,26,.97);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:5px;
  display:none;flex-direction:column;gap:3px;
  box-shadow:0 8px 28px rgba(0,0,0,.55);backdrop-filter:blur(10px);
  min-width:150px;
}
#mini-menu.on{display:flex}
.mm-btn{
  padding:9px 14px;border-radius:7px;border:none;
  font-size:12px;font-weight:700;cursor:pointer;
  font-family:'Outfit',sans-serif;text-align:left;transition:background .1s;
}
#mm-del{background:rgba(255,68,85,.14);color:#ff4455}
#mm-del:hover{background:rgba(255,68,85,.26)}
#mm-cancel{background:rgba(255,255,255,.05);color:rgba(255,255,255,.45)}
#mm-cancel:hover{background:rgba(255,255,255,.1)}

/* ══ VER FULLSCREEN ══ */
#ver{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.93);display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(10px);
}
#ver.on{display:flex}
#ver img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);pointer-events:none}
#ver-close{
  position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);
  color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .15s;
}
#ver-close:hover{background:rgba(255,255,255,.2)}
#ver-lbl{position:absolute;bottom:20px;color:rgba(255,255,255,.3);font-size:11px;font-weight:600;letter-spacing:.8px}

/* ══ MODAL ══ */
#modal{
  position:fixed;inset:0;z-index:600;
  background:rgba(0,0,0,.72);display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(6px);
}
#modal.on{display:flex}
#modal-box{
  background:#222;border:1px solid rgba(255,80,80,.25);border-radius:14px;
  padding:24px 28px;text-align:center;max-width:310px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
#modal-box h3{font-size:15px;font-weight:700;color:#fff;margin-bottom:6px}
#modal-box p{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:20px;line-height:1.55}
.modal-btns{display:flex;gap:8px}
.modal-btns button{
  flex:1;padding:10px;border-radius:8px;border:none;cursor:pointer;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  font-family:'Outfit',sans-serif;transition:all .15s;
}
#modal-cancel{background:rgba(255,255,255,.07);color:rgba(255,255,255,.45)}
#modal-cancel:hover{background:rgba(255,255,255,.12)}
#modal-confirm{background:#ff4455;color:#fff}
#modal-confirm:hover{background:#ff2233}

/* ══ TOAST ══ */
#toast{
  position:fixed;bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%);
  background:rgba(20,20,20,.93);color:#fff;padding:8px 18px;border-radius:18px;
  font-size:12px;font-weight:600;z-index:700;display:none;white-space:nowrap;
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.07);
}

/* ══ EMPTY ══ */
#empty{
  position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;opacity:.2;transition:opacity .3s;
}
#empty.hidden{opacity:0}
#empty svg{width:52px;height:52px;margin-bottom:12px}
#empty p{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--v)}
#empty small{font-size:10px;color:rgba(255,255,255,.3);display:block;margin-top:3px}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <div id="ijm-logo">
    <svg class="ijm-spiral" viewBox="0 0 100 100" fill="none">
      <path d="M50 15C50 15,78 18,82 45C86 72,62 85,42 78C22 71,18 52,28 38C38 24,58 26,64 40C70 54,58 65,46 62C34 59,32 48,38 42C44 36,52 40,52 47" stroke="#54C999" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="72" cy="22" r="2.2" fill="#54C999" opacity=".7"/>
      <circle cx="83" cy="36" r="1.6" fill="#54C999" opacity=".5"/>
      <circle cx="24" cy="61" r="1.6" fill="#54C999" opacity=".5"/>

    <div class="chip on" onclick="sacarCarta('general',this)">General</div>

  <div class="sep"></div>

  <div class="tb-right">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <line x1="9" y1="15" x2="15" y2="15"/>
      </svg>
    </button>
    <button id="btn-limpiar" onclick="pedirLimpiar()">🗑 Limpiar</button>
  </div>
</div>

<!-- MESA -->
<div id="mesa-wrap">
  <div id="mesa">
    <div id="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="#54C999" stroke-width="1.2" stroke-linecap="round">
        <rect x="2" y="4" width="20" height="16" rx="3"/>
        <path d="M12 9v6M9 12h6"/>
      </svg>
      <p>Mesa vacía</p>
      <small>Pulsa un mazo para sacar una carta</small>
    </div>
  </div>
</div>

<!-- VER FULLSCREEN -->
<div id="ver" onclick="cerrarVer()">
  <button id="ver-close" onclick="cerrarVer()">✕</button>
  <img id="ver-img" src="" alt="">
  <div id="ver-lbl"></div>
</div>

<!-- MINI MENÚ doble clic / doble toque -->
<div id="mini-menu">
  <button class="mm-btn" id="mm-del"    onclick="eliminarSeleccionada()">🗑 Eliminar</button>
  <button class="mm-btn" id="mm-cancel" onclick="cerrarMiniMenu()">Cancelar</button>
</div>

<!-- MODAL limpiar mesa -->
<div id="modal">
  <div id="modal-box">
    <h3>⚠️ Limpiar la mesa</h3>
    <p>Se eliminarán todas las cartas.<br>Esta acción no se puede deshacer.</p>
    <div class="modal-btns">
      <button id="modal-cancel" onclick="cerrarModal()">Cancelar</button>
      <button id="modal-confirm" onclick="limpiarMesa()">Eliminar todo</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
// ⚙️  CONFIGURACIÓN
// ═══════════════════════════════════════════
const SB_URL = 'https://lynqikyddjogbndaonia.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5bnFpa3lkZGpvZ2JuZGFvbmlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDI5MjEsImV4cCI6MjA5MDcxODkyMX0.pAEaYp3VO2pwccFZpy60K-Plww2tj6swCGT42xqie7U';

// Número de cartas por mazo — edita aquí cuando añadas imágenes
const MAZOS = {
  general: { n:107, bucket:'imagenes-IJM', ext:'.jpg', tipo:'foto',  banda:null      },
  s:       { n: 54, bucket:'imagenes-S',   ext:'.jpg', tipo:'foto',  banda:'banda-s' },
  n:       { n: 54, bucket:'imagenes-N',   ext:'.jpg', tipo:'foto',  banda:'banda-n' },
  pal:     { n: 33, bucket:'imagenes-PAL', ext:'.jpg', tipo:'pal',   banda:null      },
  ic:      { n: 37, bucket:'imagenes-IC',  ext:'.png', tipo:'ic',    banda:null      },
};


// ─── NOMBRES DE CARTAS (General) ───
const NOMBRES = {
  1:"Abuso",2:"Logro",3:"Acción",4:"Aventura",5:"Alerta",6:"Casi",7:"Apego",8:"Conciencia",
  9:"Equilibrio",10:"Barrera",11:"Base",12:"Creencias",13:"Nacimiento",14:"Límites",15:"Cuidado",
  16:"Celebración",17:"Claridad",18:"Confrontación",19:"Conexión",20:"Plenitud",21:"Conveniencia",
  22:"Creatividad",23:"Crisis",24:"Muerte",25:"Decisión",26:"Dedicación",27:"Defensa",
  28:"Determinación",29:"Distracción",30:"Sueño",31:"Eficiencia",32:"Esfuerzo",33:"Ego",
  34:"Elasticidad",35:"Empoderamiento",36:"Vacío",37:"Final",38:"Exceso",39:"Salida",40:"Fantasía",
  41:"Miedo",42:"Lucha",43:"Flexibilidad",44:"Fluir",45:"Foco",46:"Amistad",47:"Futuro",
  48:"Objetivo",49:"Gratitud",50:"Escondite",51:"Esperanza",52:"Identidad",53:"Impulso",
  54:"Iniciativa",55:"Intimidad",56:"Introspección",57:"Liderazgo",58:"Legado",59:"Liberación",
  60:"Vida",61:"Ligereza",62:"Escucha",63:"Carga",64:"Amor",65:"Suerte",66:"Máscara",
  67:"Medir",68:"Memoria",69:"Momento",70:"Descuidar",71:"Oportunidad",72:"Sobrecarga",
  73:"Pasión",74:"Paciencia",75:"Pausa",76:"Perspectiva",77:"Proceso",78:"Proyecciones",
  79:"Reflejo",80:"Renovación",81:"Resistencia",82:"Descanso",83:"Resultados",84:"Ritmo",
  85:"Tristeza",86:"Escasez",87:"Singularidad",88:"Velocidad",89:"Espontaneidad",90:"Estancamiento",
  91:"Inicio",92:"Fuerza",93:"Bloqueo",94:"Éxito",95:"Equipo",96:"Tentación",97:"Ataduras",
  98:"Tiempo",99:"Transformación",100:"Transición",101:"Confianza",102:"Unidad",103:"Valor",
  104:"Visión",105:"Voz",106:"Espera",107:"Anhelo"
};

// ═══════════════════════════════════════════
let cartas=[], zMax=10, cardCount=0;
let cartaSeleccionada=null, miniTarget=null;

function imgUrl(mazo,n){
  const m=MAZOS[mazo];
  return `${SB_URL}/storage/v1/object/public/${m.bucket}/${n}${m.ext}`;
}

// ─── SACAR CARTA ───
function sacarCarta(mazo, el){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  if(el) el.classList.add('on');
  const m=MAZOS[mazo];
  const n=Math.floor(Math.random()*m.n)+1;
  const wrap=document.getElementById('mesa-wrap');
  const x=14+Math.random()*18;
  const y=14+wrap.scrollTop+Math.random()*14;
  crearCarta(mazo,n,x,y);
  document.getElementById('empty').classList.add('hidden');
}

// ─── CREAR CARTA ───
function crearCarta(mazo,n,x,y){
  const m=MAZOS[mazo];
  const div=document.createElement('div');
  div.className=`carta carta-${m.tipo==='foto'?'foto':m.tipo}`;
  div.style.left=x+'px'; div.style.top=y+'px';
  div.style.zIndex=++zMax;

  if(m.tipo==='foto'){
    const img=document.createElement('img');
    img.src=imgUrl(mazo,n); img.draggable=false; img.alt='';
    div.appendChild(img);
    if(m.banda){
      const b=document.createElement('div');
      b.className=`banda ${m.banda}`; div.appendChild(b);
    }
    // Franja nombre (solo cartas generales con nombre conocido)
    if(NOMBRES[n]){
      const franja=document.createElement('div');
      franja.className='franja-nombre';
      const txt=document.createElement('span');
      txt.className='fn-txt'; txt.textContent=NOMBRES[n];
      franja.appendChild(txt);
      franja.addEventListener('click', e=>{
        e.stopPropagation();
        franja.classList.toggle('on');
      });
      franja.addEventListener('touchend', e=>{
        e.stopPropagation(); e.preventDefault();
        franja.classList.toggle('on');
      },{passive:false});
      div.appendChild(franja);
    }
  } else if(m.tipo==='pal'){
    const img=document.createElement('img');
    img.src=imgUrl(mazo,n); img.draggable=false; img.alt='';
    div.appendChild(img);
  } else if(m.tipo==='ic'){
    const img=document.createElement('img');
    img.src=imgUrl(mazo,n); img.draggable=false; img.alt='';
    div.appendChild(img);
    const inp=document.createElement('input');
    inp.className='ic-input'; inp.placeholder='¿Qué pregunta te sugiere?';
    inp.onmousedown=e=>e.stopPropagation();
    inp.ontouchstart=e=>e.stopPropagation();
    div.appendChild(inp);
  }

  añadirBtnDel(div);
  añadirGestos(div, ()=>verAmpliada(mazo,n));
  document.getElementById('mesa').appendChild(div);
  cartas.push(div); actualizarContador();
}

// ─── CREAR NOTA ───
function crearNota(){
  const wrap=document.getElementById('mesa-wrap');
  const x=20+Math.random()*18;
  const y=18+wrap.scrollTop+Math.random()*14;
  const div=document.createElement('div');
  div.className='carta carta-nota';
  div.style.left=x+'px'; div.style.top=y+'px';
  div.style.zIndex=++zMax;

  div.innerHTML=`
    <div class="nota-hdr">
      <svg viewBox="0 0 24 24" fill="none" stroke="#54C999" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      <span>Nota — arrastra aquí</span>
    </div>
    <textarea class="nota-body" placeholder="Escribe aquí..."></textarea>
  `;

  const ta=div.querySelector('textarea');
  ta.onmousedown=e=>e.stopPropagation();
  ta.ontouchstart=e=>e.stopPropagation();

  // Drag desde el header
  const hdr=div.querySelector('.nota-hdr');
  makeDraggable(div, hdr);

  añadirBtnDel(div);

  // Doble clic/toque → mini menú
  div.addEventListener('dblclick',e=>{
    if(e.target.tagName==='TEXTAREA'||e.target.tagName==='BUTTON') return;
    e.preventDefault(); mostrarMiniMenu(e.clientX,e.clientY,div);
  });

  div.addEventListener('mousedown',()=>{seleccionar(div);div.style.zIndex=++zMax;});

  document.getElementById('mesa').appendChild(div);
  cartas.push(div); actualizarContador();
  document.getElementById('empty').classList.add('hidden');
  setTimeout(()=>ta.focus(),80);
}

// ─── BTN ELIMINAR ───
function añadirBtnDel(div){
  const del=document.createElement('button');
  del.className='btn-del'; del.textContent='✕';
  del.onclick=e=>{e.stopPropagation();eliminarCarta(div);};
  div.appendChild(del);
}

// ─── GESTOS cartas (clic, doble, drag) ───
function añadirGestos(div, onSingleClick){
  div.addEventListener('mousedown',()=>{
    seleccionar(div); div.style.zIndex=++zMax;
  });
  if(onSingleClick){
    div._clickTimer=null;
    div.addEventListener('click',e=>{
      if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT') return;
      if(e.target.classList.contains('franja-nombre')||e.target.classList.contains('fn-txt')) return;
      clearTimeout(div._clickTimer);
      div._clickTimer=setTimeout(()=>{
        if(!div._dbl) onSingleClick();
        div._dbl=false;
      },230);
    });
  }
  div.addEventListener('dblclick',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='BUTTON') return;
    if(e.target.classList.contains('franja-nombre')||e.target.classList.contains('fn-txt')) return;
    e.preventDefault(); div._dbl=true;
    clearTimeout(div._clickTimer);
    mostrarMiniMenu(e.clientX, e.clientY, div);
  });
  makeDraggable(div, div);
}

// ─── DRAG ───
function makeDraggable(el, handle){
  const h = handle || el;
  let sx,sy,sl,st,moved;

  h.addEventListener('mousedown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='BUTTON') return;
    e.preventDefault();
    seleccionar(el); el.style.zIndex=++zMax;
    const wrap=document.getElementById('mesa-wrap');
    sx=e.clientX; sy=e.clientY+wrap.scrollTop;
    sl=parseInt(el.style.left)||0; st=parseInt(el.style.top)||0;
    moved=false; el.classList.add('dragging');

    function mv(e){
      const dx=e.clientX-sx, dy=(e.clientY+wrap.scrollTop)-sy;
      if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
      if(!moved) return;
      const mesa=document.getElementById('mesa');
      el.style.left=Math.max(0,Math.min(sl+dx,mesa.offsetWidth-el.offsetWidth))+'px';
      el.style.top=Math.max(0,Math.min(st+dy,mesa.offsetHeight-el.offsetHeight))+'px';
    }
    function up(){
      el.classList.remove('dragging');
      document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up);
    }
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
  });

  // Touch
  let lastTap=0;
  h.addEventListener('touchstart',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='BUTTON') return;
    const now=Date.now();
    if(now-lastTap<280){
      e.preventDefault();
      const t=e.touches[0];
      mostrarMiniMenu(t.clientX,t.clientY,el);
      lastTap=0; return;
    }
    lastTap=now;
    seleccionar(el); el.style.zIndex=++zMax;
    const wrap=document.getElementById('mesa-wrap');
    const t=e.touches[0];
    sx=t.clientX; sy=t.clientY+wrap.scrollTop;
    sl=parseInt(el.style.left)||0; st=parseInt(el.style.top)||0;
    moved=false; el.classList.add('dragging');

    function tm(e){
      e.preventDefault(); moved=true;
      const t=e.touches[0];
      const mesa=document.getElementById('mesa');
      el.style.left=Math.max(0,Math.min(sl+(t.clientX-sx),mesa.offsetWidth-el.offsetWidth))+'px';
      el.style.top=Math.max(0,Math.min(st+(t.clientY+wrap.scrollTop-sy),mesa.offsetHeight-el.offsetHeight))+'px';
    }
    function tu(){ el.classList.remove('dragging'); h.removeEventListener('touchmove',tm); h.removeEventListener('touchend',tu); }
    h.addEventListener('touchmove',tm,{passive:false});
    h.addEventListener('touchend',tu);
  },{passive:true});
}

// ─── MINI MENÚ ───
function mostrarMiniMenu(cx,cy,el){
  miniTarget=el; seleccionar(el);
  const mm=document.getElementById('mini-menu');
  mm.style.left=Math.min(cx,window.innerWidth-160)+'px';
  mm.style.top=Math.max(8,cy-76)+'px';
  mm.classList.add('on');
}
function cerrarMiniMenu(){
  document.getElementById('mini-menu').classList.remove('on');
  miniTarget=null;
}
function eliminarSeleccionada(){
  if(miniTarget) eliminarCarta(miniTarget);
  cerrarMiniMenu();
}

// ─── VER FULLSCREEN ───
function verAmpliada(mazo,n){
  document.getElementById('ver-img').src=imgUrl(mazo,n);
  document.getElementById('ver-lbl').textContent=`${mazo.toUpperCase()} · ${n}`;
  document.getElementById('ver').classList.add('on');
}
function cerrarVer(){ document.getElementById('ver').classList.remove('on'); }

// ─── SELECCIÓN / ELIMINAR ───
function seleccionar(el){
  if(cartaSeleccionada) cartaSeleccionada.classList.remove('selected');
  cartaSeleccionada=el; el.classList.add('selected');
}
function eliminarCarta(el){
  el.style.transition='opacity .18s,transform .18s';
  el.style.opacity='0'; el.style.transform='scale(.8)';
  setTimeout(()=>{
    el.remove(); cartas=cartas.filter(c=>c!==el);
    if(cartaSeleccionada===el) cartaSeleccionada=null;
    actualizarContador();
    if(cartas.length===0) document.getElementById('empty').classList.remove('hidden');
  },180);
}

// ─── LIMPIAR MESA ───
function pedirLimpiar(){
  if(cartas.length===0){toast('La mesa ya está vacía');return;}
  document.getElementById('modal').classList.add('on');
}
function cerrarModal(){ document.getElementById('modal').classList.remove('on'); }
function limpiarMesa(){
  cartas.forEach(c=>c.remove()); cartas=[];
  cartaSeleccionada=null; cerrarModal(); actualizarContador();
  document.getElementById('empty').classList.remove('hidden');
  toast('Mesa limpiada');
}

// ─── TECLADO ───
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ cerrarVer(); cerrarModal(); cerrarMiniMenu(); }
  if(e.key==='Delete' && e.target.tagName!=='INPUT' && e.target.tagName!=='TEXTAREA'){
    if(cartaSeleccionada) eliminarCarta(cartaSeleccionada);
  }
});

// Cerrar mini menú al clicar en mesa vacía
document.getElementById('mesa').addEventListener('mousedown',e=>{
  if(!e.target.closest('.carta')){
    cerrarMiniMenu();
    if(cartaSeleccionada){ cartaSeleccionada.classList.remove('selected'); cartaSeleccionada=null; }
  }
});

// ─── UTILS ───
function actualizarContador(){
  const n=cartas.length;
  document.getElementById('contador').textContent=n===0?'':n===1?'1 carta':`${n} cartas`;
}
let _tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  clearTimeout(_tt); _tt=setTimeout(()=>el.style.display='none',2400);
}
</script>
